[package]
name = "pixlzr-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "pixlzr-core — density-aware block image codec (format v1), native + WASM"
repository = "https://github.com/guiga-zalu/pixlzr"
keywords = ["codec", "image", "wasm"]
categories = ["multimedia::images", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wee_alloc"]
bench = []
cli = ["dep:png"]

[dependencies]
miniz_oxide = "0.8"
wasm-bindgen = { version = "0.2", optional = true }
wee_alloc = { version = "0.4", optional = true }
png = { version = "0.17", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "codec"
harness = false

[[bin]]
name = "pixlzr"
path = "src/bin/pixlzr.rs"
required-features = ["cli"]
bench = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
