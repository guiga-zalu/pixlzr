<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXLZR — WASM Demo</title>
<link rel="stylesheet" href="src/style.css">
<h1>PIXLZR — Live Demo</h1>
<p>Drag-drop a PNG/JPEG below. Runs <code>pixlzr-core</code> WASM — no upload, all local.</p>

<div class="drop" id="drop">
  <p>Drop image here or <label for="file" class="btn">Choose file</label></p>
  <input id="file" type="file" accept="image/png,image/jpeg" hidden>
</div>

<div class="controls">
  <label>q_base <input id="q" type="range" min="0.4" max="1.0" step="0.05" value="0.8"> <span id="qv">0.80</span></label>
  <span id="error" class="error"></span>
</div>

<div class="panes">
  <figure><figcaption>Original — <span id="orig-meta">—</span></figcaption><canvas id="orig"></canvas></figure>
  <figure><figcaption>Decoded (PIXLZR) — <span id="dec-meta">—</span></figcaption><canvas id="dec"></canvas></figure>
</div>

<div class="stats" id="stats">Encode — · Decode — · Ratio —</div>
<div class="actions">
  <a id="dl-pixlzr" download="output.pixlzr" class="btn" hidden>Download .pixlzr</a>
  <a id="dl-png" download="restored.png" class="btn" hidden>Download restored.png</a>
</div>

<p class="foot"><a href="https://github.com/guiga-zalu/pixlzr">GitHub</a> · <a href="../docs/architecture.md">Architecture</a> · WASM single-thread; native is ~2× faster.</p>
<script type="module" src="src/index.js"></script>
